# generated by `draftpaper apply` (config.toml [session] apps): tmux's sessions kept across a reboot.
# As the server starts, the sessions it had are made again (before `tmux attach` looks for one); while
# it runs, they are saved every few seconds to ~/.local/state/draftpaper/tmux.json.
run-shell 'draftpaper tmux restore "#{socket_path}"'
run-shell -b 'draftpaper tmux keep "#{socket_path}"'
