# generated by `draftpaper apply` ({{label}}): sourced by tmux.conf
set -g status-style "bg={{bg_alt}},fg={{fg}}"
set -g status-left-style "bg={{bg_alt}},fg={{accent}}"
set -g status-right-style "bg={{bg_alt}},fg={{fg_dim}}"
setw -g window-status-style "bg={{bg_alt}},fg={{fg_dim}}"
setw -g window-status-current-style "bg={{accent}},fg={{on_accent}},bold"
setw -g window-status-activity-style "bg={{bg_alt}},fg={{warn}}"
setw -g window-status-bell-style "bg={{urgent}},fg={{on_accent}}"
set -g pane-border-style "fg={{border}}"
set -g pane-active-border-style "fg={{accent}}"
set -g message-style "bg={{surface}},fg={{fg}}"
set -g message-command-style "bg={{surface}},fg={{accent}}"
setw -g mode-style "bg={{sel_bg}},fg={{sel_fg}}"
set -g clock-mode-colour "{{accent}}"
setw -g copy-mode-match-style "bg={{secondary}},fg={{on_accent}}"
setw -g copy-mode-current-match-style "bg={{accent}},fg={{on_accent}}"
set -g display-panes-colour "{{fg_muted}}"
set -g display-panes-active-colour "{{accent}}"
set -g popup-border-style "fg={{border}}"
set -g popup-style "bg={{surface}},fg={{fg}}"
