# Which portal backend does what in a Draftpaper session (XDG_CURRENT_DESKTOP=Draftpaper): screen sharing
# and screenshots through xdg-desktop-portal-wlr, which captures with the compositor's screencopy; the
# rest (file choosers, settings) through GTK.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
