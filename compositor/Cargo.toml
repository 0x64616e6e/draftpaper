[package]
name = "draftpaper-compositor"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Draftpaper as a Wayland compositor (milestone M0: nested prototype)"
repository = "https://github.com/0x64616e6e/draftpaper"

[[bin]]
name = "draftpaper-compositor"
path = "src/main.rs"

[dependencies]
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
bitflags = "2.2.1"
toml = "0.8"
thiserror = "2"
xcursor = "0.3"
png = "0.17"
serde_json = "1"
# the wallpaper: decoding, cropping, the ambient colours and the frosted title block
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# signals: SIGTERM ends the session cleanly, SIGUSR1 takes a screenshot
calloop = { version = "0.14", features = ["signals"] }

[dependencies.smithay]
version = "=0.7.0"
default-features = false
features = [
    "backend_winit", "wayland_frontend", "desktop",
    # the TTY backend
    "backend_drm", "backend_gbm", "backend_egl", "backend_libinput", "backend_udev",
    "backend_session_libseat", "renderer_gl", "use_system_lib",
    # X11 applications through Xwayland
    "xwayland",
]
