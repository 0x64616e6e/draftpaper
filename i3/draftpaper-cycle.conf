# Draftpaper: Super+Left/Right cycle through the windows parked on the workspace; with none parked
# they move the focus left and right as before. These are i3's default focus keys, so remove your own
# `bindsym $mod+Left` and `bindsym $mod+Right` lines before adding, after the main include:
#
#     include /usr/share/draftpaper/i3/draftpaper-cycle.conf
#
# Or keep your keys and bind others, for example:
#     bindsym $mod+bracketright exec --no-startup-id draftpaper park next
#     bindsym $mod+bracketleft  exec --no-startup-id draftpaper park prev
bindsym $mod+Left exec --no-startup-id draftpaper park prev
bindsym $mod+Right exec --no-startup-id draftpaper park next
