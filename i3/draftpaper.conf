# Draftpaper for i3. Add to ~/.config/i3/config, after `set $mod ...`:
#
#     include /usr/share/draftpaper/i3/draftpaper.conf
#
# and remove your `bar { }` block: the sheet's margins and title block replace the bar.
# Cycling through parked windows has its own include (draftpaper-cycle.conf), because its keys
# (Super+Left/Right) are i3's default focus keys; or bind `draftpaper park next|prev` yourself.

# window colours and gaps (windows end on the sheet's frame line), generated per theme
include ~/.cache/draftpaper/i3.conf
default_border pixel 1
default_floating_border pixel 1

exec_always --no-startup-id draftpaper start

# park the focused window in a side-margin cell; on a workspace with every window parked, bring them back
bindsym $mod+Escape exec --no-startup-id draftpaper park toggle
