[package]
name = "draftpaper-sheet"
version = "0.7.5"
edition = "2021"
description = "Draftpaper's sheet: the margins and the title block, drawn on the processor"
license = "MIT"

[[bin]]
name = "draftpaper-sheet"
path = "src/main.rs"

[dependencies]
smithay-client-toolkit = "0.21"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
serde_json = { version = "1", features = ["preserve_order"] }
fontdue = "0.9.5"
fontdb = "0.24.0"
libc = "0.2.191"
draftpaper = { version = "0.7.5", path = "../cli" }
calloop = "0.14.5"
calloop-wayland-source = "0.4.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
