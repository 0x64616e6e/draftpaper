[package]
name = "draftpaper"
version = "0.7.5"
edition = "2021"
description = "Draftpaper's command: themes, colour schemes, the shell's readings, the applications' colours"
license = "MIT"

[lib]
name = "draftpaper"
path = "src/lib.rs"
# the indented blocks in the module docs are tables, not Rust
doctest = false

[[bin]]
name = "draftpaper"
path = "src/main.rs"

[dependencies]
# order kept as written: themes and config are read and written back in their own order
toml = { version = "1.1", features = ["preserve_order"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
rustix = { version = "1.1.5", features = ["fs"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
