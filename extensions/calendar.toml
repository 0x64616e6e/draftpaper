# Today, from a calendar you can fetch as iCalendar: `draftpaper schedule calendar`.
#
# Put your feed's address in `url` below and leave the command alone — in Google Calendar it is
# Settings → your calendar → "Secret address in iCal format", and in Nextcloud the calendar's share
# link with ?export on the end. Anyone with that address can read the calendar, so keep the file to
# yourself: chmod 600.
interval = 600
url = ""
command = ["sh", "-c", '''
say() { printf '{"title": "TODAY", "meta": "%s", "rows": []}' "$1"; exit 0; }
[ -n "$DRAFTPAPER_URL" ] || say "set url in calendar.toml"
feed=$(curl -sf --max-time 15 "$DRAFTPAPER_URL") || feed=
[ -n "$feed" ] || say "no answer"
printf '%s' "$feed" | tr -d '\r' | sed -e :a -e '$!N;s/\n //;ta' -e 'P;D' |
awk -v day="$(date +%Y%m%d)" '
  /^BEGIN:VEVENT/ { t = ""; s = ""; l = "" }
  /^DTSTART/      { v = $0; sub(/^[^:]*:/, "", v); t = v }
  /^SUMMARY:/     { s = substr($0, 9) }
  /^LOCATION:/    { l = substr($0, 10) }
  /^END:VEVENT/   { if (substr(t, 1, 8) == day) printf "%s\t%s\t%s\n", (length(t) > 8 ? substr(t, 10, 2) ":" substr(t, 12, 2) : "all day"), s, l }' |
sort | jq -Rs '{
  title: "TODAY",
  meta: "\(split("\n") | map(select(length > 0)) | length) ENTRIES",
  columns: [{name: "WHEN", mm: 22}, {name: "WHAT", mm: 0}],
  note: 1,
  rows: (split("\n") | map(select(length > 0) | split("\t")
    | {cells: [.[0], .[1]], note: (.[2] // "")}))
}'
''']
