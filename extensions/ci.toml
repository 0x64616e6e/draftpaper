# The last runs of a repository on GitHub (needs `gh`, logged in): `draftpaper schedule ci`.
#
# Set `repo` below and leave the command alone. Whatever letters the sheet runs from your home
# directory, not from a checkout, so `gh` has no repository to guess from.
interval = 60
repo = ""                               # owner/name, as in 0x64616e6e/draftpaper
last = 9                                # how many of the last runs to letter
command = ["sh", "-c", '''
say() { printf '{"title": "CI", "meta": "%s", "rows": []}' "$1"; exit 0; }
command -v gh > /dev/null || say "gh is not installed"
[ -n "$DRAFTPAPER_REPO" ] || say "set repo in ci.toml"
got=$(gh run list --repo "$DRAFTPAPER_REPO" --limit "$DRAFTPAPER_LAST" \
        --json number,workflowName,headBranch,status,conclusion,startedAt,displayTitle 2> /dev/null) || got=
[ -n "$got" ] && [ "$got" != "[]" ] || say "no answer from $DRAFTPAPER_REPO"
printf '%s' "$got" | jq -c --arg repo "$DRAFTPAPER_REPO" '{
  title: "CI",
  meta: "\($repo | ascii_upcase) · \(map(select(.conclusion == "failure")) | length) OF \(length) FAILED",
  columns: [{name: "RUN", mm: 14}, {name: "WORKFLOW", mm: 26}, {name: "BRANCH", mm: 26},
            {name: "WHAT", mm: 0}, {name: "RESULT", mm: 24, right: true}],
  note: 3,
  rows: map({
    cells: ["#\(.number)", .workflowName, .headBranch,
            (.displayTitle | if length > 46 then .[0:45] + "…" else . end),
            (if .status != "completed" then (.status | gsub("_"; " ")) else .conclusion end)],
    note: (.startedAt[0:16] | sub("T"; " ")),
    ink: (if .conclusion == "failure" then "alert"
          elif .status != "completed" then "strong"
          else "" end)})
}'
''']
