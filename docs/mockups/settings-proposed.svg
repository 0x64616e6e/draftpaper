<?xml version="1.0" encoding="UTF-8"?>
<!-- The settings panel proposed in docs/interface.md, second pass. One user unit is one millimetre;
     the sheet on eDP-1 is 300 x 187.5 mm, margin 4.9 mm. Theme: softglow.

     The ladders are unchanged:
       lettering  5 / 3.5 / 2.5 mm    heading / title / note          (ISO 3098 nominal heights)
       rules      0.5 / 0.25 mm       heavy / thin, a 2:1 line group  (ISO 128-20)
       spacing    2 3 4 6 8 12 16 mm

     What changed is the ink. The first pass ruled every row, which was the border-per-row mistake
     at lower contrast; stranded each value at the far edge of the sheet; and left the bottom third
     as residue. Here:
       - two marks in all: one rule under the headings, one tick on the current page.
       - name, note and value on one line, in three aligned columns. Alignment separates them;
         nothing is drawn to do it.
       - a row is one line, so nine rows take 72 mm instead of 108.
       - the sheet's own title block shows through the corner the panel used to paint over
         (Board.qml already does this: keepBlock). The quiet field is then a shape with an anchor,
         not what was left over.
       - the page numbers are gone. Nothing reaches a page by number, so they were ink with no
         reading; if the digits ever become keys they come back as keys. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 187.5" width="1280" height="800">
  <style>
    text { font-family: "IBM Plex Mono", monospace; }
    .ink   { fill: #3c3630; }
    .mid   { fill: #3c3630; fill-opacity: 0.62; }
    .wisp  { fill: #3c3630; fill-opacity: 0.34; }
    .page  { fill: #3c3630; fill-opacity: 0.52; }
    .rule  { stroke: #3c3630; }
  </style>

  <rect width="300" height="187.5" fill="#d9d2c7"/>
  <rect x="4.9" y="4.9" width="290.2" height="177.7" fill="#cdc6ba"/>
  <rect x="4.9" y="4.9" width="290.2" height="177.7" fill="none" stroke="#b4442f" stroke-width="0.47"/>

  <!-- the hint the sheet already letters along its top margin, where it already letters it -->
  <text x="150" y="3.4" class="wisp" font-size="2.5" text-anchor="middle">↑↓ rows · ←→ pick · tab next page · enter keep · esc back</text>

  <!-- ===================== the headings, and the one rule =====================
       The rule runs the whole measure, under both headings: one mark, tying the two columns
       together, which is the thing the first pass never did. -->
  <text x="12.9" y="22" class="mid" font-size="5" letter-spacing="0.6">SETTINGS</text>
  <text x="68.9" y="22" class="ink" font-size="5" letter-spacing="0.6">TOUCHPAD</text>
  <text x="287.1" y="22" class="wisp" font-size="2.5" text-anchor="end">ELAN0676 · 114 × 58 mm</text>
  <line x1="12.9" y1="25" x2="287.1" y2="25" class="rule" stroke-width="0.25"/>

  <!-- ===================== the pages =====================
       Lettering at an 8 mm pitch, no boxes, no numbers. The current one is in full ink with a
       short heavy tick in the gutter, and stays in its place in the list. -->
  <g font-size="3.5">
    <text x="12.9" y="35.2" class="page">COLOUR SCHEME</text>
    <text x="12.9" y="43.2" class="page">WALLPAPER</text>
    <text x="12.9" y="51.2" class="page">DISPLAYS</text>
    <text x="12.9" y="59.2" class="page">TEXT</text>
    <text x="12.9" y="67.2" class="page">SHEET</text>
    <text x="12.9" y="75.2" class="page">RULERS</text>
    <text x="12.9" y="83.2" class="page">SESSION</text>
    <text x="12.9" y="91.2" class="page">INPUT</text>

    <line x1="8.9" y1="98" x2="11.9" y2="98" class="rule" stroke-width="0.5"/>
    <text x="12.9" y="99.2" class="ink">TOUCHPAD</text>

    <text x="12.9" y="107.2" class="page">TOUCH</text>
    <text x="12.9" y="115.2" class="page">IDLE · LOCK</text>
  </g>

  <!-- ===================== the rows =====================
       One line each: the name, the note it needs, and the values. Three columns held by
       alignment alone. The chosen value is the only thing in full ink on its line, so the
       column of answers reads straight down without a single mark to guide it. -->
  <g>
    <!-- the row the keys are on, marked as the page is: a tick, and full ink on the name -->
    <line x1="64.9" y1="34" x2="67.9" y2="34" class="rule" stroke-width="0.5"/>
    <text x="68.9" y="35.2" class="ink" font-size="3.5">TAP TO CLICK</text>
    <text x="110.9" y="35.2" class="wisp" font-size="2.5">a tap is a click, without pressing the pad</text>
    <text x="182.9" y="35.2" class="ink" font-size="3.5">on</text>
    <text x="196.9" y="35.2" class="wisp" font-size="3.5">off</text>

    <text x="68.9" y="43.2" class="mid" font-size="3.5">TAP AND DRAG</text>
    <text x="110.9" y="43.2" class="wisp" font-size="2.5">tap, then tap and hold: the second tap drags</text>
    <text x="182.9" y="43.2" class="ink" font-size="3.5">on</text>
    <text x="196.9" y="43.2" class="wisp" font-size="3.5">off</text>

    <text x="68.9" y="51.2" class="mid" font-size="3.5">NATURAL SCROLLING</text>
    <text x="110.9" y="51.2" class="wisp" font-size="2.5">the content follows the fingers</text>
    <text x="182.9" y="51.2" class="wisp" font-size="3.5">off</text>
    <text x="196.9" y="51.2" class="ink" font-size="3.5">on</text>

    <text x="68.9" y="59.2" class="mid" font-size="3.5">QUIET WHILE TYPING</text>
    <text x="110.9" y="59.2" class="wisp" font-size="2.5">the heel of a hand is not a click</text>
    <text x="182.9" y="59.2" class="ink" font-size="3.5">on</text>
    <text x="196.9" y="59.2" class="wisp" font-size="3.5">off</text>

    <text x="68.9" y="67.2" class="mid" font-size="3.5">CLICK</text>
    <text x="110.9" y="67.2" class="wisp" font-size="2.5">where a press of the pad is left or right</text>
    <text x="182.9" y="67.2" class="ink" font-size="3.5">by area</text>
    <text x="212.9" y="67.2" class="wisp" font-size="3.5">by fingers</text>

    <text x="68.9" y="75.2" class="mid" font-size="3.5">SCROLL</text>
    <text x="110.9" y="75.2" class="wisp" font-size="2.5">how two fingers move the page</text>
    <text x="182.9" y="75.2" class="ink" font-size="3.5">two fingers</text>
    <text x="228.9" y="75.2" class="wisp" font-size="3.5">the edge</text>

    <text x="68.9" y="83.2" class="mid" font-size="3.5">SPEED</text>
    <text x="110.9" y="83.2" class="wisp" font-size="2.5">how far a finger carries the pointer</text>
    <text x="182.9" y="83.2" class="wisp" font-size="3.5">slow</text>
    <text x="205.9" y="83.2" class="wisp" font-size="3.5">steady</text>
    <text x="232.9" y="83.2" class="ink" font-size="3.5">standard</text>
    <text x="255.9" y="83.2" class="wisp" font-size="3.5">quick</text>
    <text x="272.9" y="83.2" class="wisp" font-size="3.5">fast</text>

    <text x="68.9" y="91.2" class="mid" font-size="3.5">MIDDLE BUTTON</text>
    <text x="110.9" y="91.2" class="wisp" font-size="2.5">both buttons at once is the middle one</text>
    <text x="182.9" y="91.2" class="wisp" font-size="3.5">off</text>
    <text x="196.9" y="91.2" class="ink" font-size="3.5">on</text>

    <text x="68.9" y="99.2" class="mid" font-size="3.5">LEFT-HANDED</text>
    <text x="110.9" y="99.2" class="wisp" font-size="2.5">the buttons swapped</text>
    <text x="182.9" y="99.2" class="wisp" font-size="3.5">off</text>
    <text x="196.9" y="99.2" class="ink" font-size="3.5">on</text>
  </g>

  <!-- ===================== the sheet's own title block, showing through =====================
       130 x 36 mm in the frame's bottom-right corner (TitleBlock.qml). The settings paint over it
       today (keepBlock: false); letting it stand gives the quiet field below the rows something
       to end on, and it is the product rather than decoration. Drawn here as it really reads. -->
  <g>
    <line x1="165.1" y1="146.6" x2="295.1" y2="146.6" class="rule" stroke-width="0.5"/>
    <line x1="165.1" y1="146.6" x2="165.1" y2="182.6" class="rule" stroke-width="0.5"/>
    <line x1="165.1" y1="158.6" x2="295.1" y2="158.6" class="rule" stroke-width="0.25"/>
    <line x1="165.1" y1="170.6" x2="295.1" y2="170.6" class="rule" stroke-width="0.25"/>
    <line x1="208.4" y1="146.6" x2="208.4" y2="182.6" class="rule" stroke-width="0.25"/>
    <line x1="251.7" y1="146.6" x2="251.7" y2="182.6" class="rule" stroke-width="0.25"/>
    <g font-size="2.5">
      <text x="167.6" y="151" class="wisp">PROJECT</text>
      <text x="210.9" y="151" class="wisp">POWER</text>
      <text x="254.2" y="151" class="wisp">NETWORK</text>
      <text x="167.6" y="163" class="wisp">DRAWN</text>
      <text x="210.9" y="163" class="wisp">CPU / MEM</text>
      <text x="254.2" y="163" class="wisp">TEMP</text>
      <text x="167.6" y="175" class="wisp">SCALE</text>
      <text x="210.9" y="175" class="wisp">PROFILE</text>
      <text x="254.2" y="175" class="wisp">SHEET</text>
    </g>
    <g font-size="3.5" class="mid">
      <text x="167.6" y="156">SIGNAL</text>
      <text x="210.9" y="156">87%</text>
      <text x="254.2" y="156">capella</text>
      <text x="167.6" y="168">dann</text>
      <text x="210.9" y="168">4% · 23%</text>
      <text x="254.2" y="168">47°</text>
      <text x="167.6" y="180">1:1</text>
      <text x="210.9" y="180">perf</text>
      <text x="254.2" y="180">1 OF 1</text>
    </g>
  </g>
</svg>
