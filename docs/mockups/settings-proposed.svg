<?xml version="1.0" encoding="UTF-8"?>
<!-- The settings panel, third pass: docs/interface.md's ladders under docs/design-research.md's
     findings. One user unit is one millimetre; the sheet on eDP-1 is 300 x 187.5 mm, margin 4.9 mm.

     What the research changed, point by point:

     THE FOURTH LOOK (Neurath). A screen must say one thing at a glance. Nine permanent notes said
     nine. The note now belongs to the row you are on and lives in one fixed place: the notes
     corner, where a drawing has always put them. Nothing moves when you change rows; one field
     changes what it reads.

     ONE CHANNEL PER MESSAGE (Tufte, 1+1=3). The current row is marked once, with an accent tick. Not a
     tick and a weight and a fill. The current page is marked once: full ink against faint.

     HUE FOR ATTENTION, NEVER FOR MAGNITUDE (preattentive evidence). One accent mark on the sheet,
     and it is the answer to "where am I". The frame's red, used once, is a Constructivist economy:
     a restricted palette makes a single accent enormous.

     MAGNITUDE BY POSITION (preattentive evidence, Isotype). SPEED is an ordered quantity, so it is
     drawn as a position along a scale, not as five words of equal weight. A different kind of value
     gets a different kind of mark.

     EMPTINESS MUST HOLD SOMETHING OPEN (ma, Hara). The four corners each have work: the pages, the
     rows, the note, and the sheet's own title block showing through (Board.qml's keepBlock). The
     weight sits off-centre, top-left to bottom-right, rather than evenly over a field.

     RHYTHM, NOT A METRONOME (against Swiss coldness). 16 mm of air under the headings and above the
     notes; 8 mm between rows. Three intervals from the one ladder, not one interval everywhere. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 187.5" width="1280" height="800">
  <style>
    text { font-family: "IBM Plex Mono", monospace; }
    .ink    { fill: #3c3630; }
    .mid    { fill: #3c3630; fill-opacity: 0.62; }
    .page   { fill: #3c3630; fill-opacity: 0.50; }
    .wisp   { fill: #3c3630; fill-opacity: 0.34; }
    .rule   { stroke: #3c3630; }
    .accent { stroke: #b4442f; }
  </style>

  <rect width="300" height="187.5" fill="#d9d2c7"/>
  <rect x="4.9" y="4.9" width="290.2" height="177.7" fill="#cdc6ba"/>
  <rect x="4.9" y="4.9" width="290.2" height="177.7" fill="none" stroke="#b4442f" stroke-width="0.47"/>

  <!-- the hint, where the sheet already letters it -->
  <text x="150" y="3.4" class="wisp" font-size="2.5" text-anchor="middle">↑↓ rows · ←→ pick · tab next page · enter keep · esc back</text>

  <!-- ===== the headings, and the only rule on the sheet ===== -->
  <text x="12.9" y="22" class="mid" font-size="5" letter-spacing="0.6">SETTINGS</text>
  <text x="68.9" y="22" class="ink" font-size="5" letter-spacing="0.6">TOUCHPAD</text>
  <text x="287.1" y="22" class="wisp" font-size="2.5" text-anchor="end">ELAN0676 · 114 × 58 mm</text>
  <line x1="12.9" y1="25" x2="287.1" y2="25" class="rule" stroke-width="0.25"/>

  <!-- ===== the pages: 8 mm pitch, no boxes, no numbers, one channel ===== -->
  <g font-size="3.5">
    <text x="12.9" y="41.2" class="page">COLOUR SCHEME</text>
    <text x="12.9" y="49.2" class="page">WALLPAPER</text>
    <text x="12.9" y="57.2" class="page">DISPLAYS</text>
    <text x="12.9" y="65.2" class="page">TEXT</text>
    <text x="12.9" y="73.2" class="page">SHEET</text>
    <text x="12.9" y="81.2" class="page">RULERS</text>
    <text x="12.9" y="89.2" class="page">SESSION</text>
    <text x="12.9" y="97.2" class="page">INPUT</text>
    <text x="12.9" y="105.2" class="ink">TOUCHPAD</text>
    <text x="12.9" y="113.2" class="page">TOUCH</text>
    <text x="12.9" y="121.2" class="page">IDLE · LOCK</text>
  </g>

  <!-- ===== the rows ===== -->
  <g font-size="3.5">
    <text x="68.9" y="41.2" class="mid">TAP TO CLICK</text>
    <text x="196.9" y="41.2" class="ink">on</text>
    <text x="232.9" y="41.2" class="wisp">off</text>

    <text x="68.9" y="49.2" class="mid">TAP AND DRAG</text>
    <text x="196.9" y="49.2" class="ink">on</text>
    <text x="232.9" y="49.2" class="wisp">off</text>

    <text x="68.9" y="57.2" class="mid">NATURAL SCROLLING</text>
    <text x="196.9" y="57.2" class="wisp">off</text>
    <text x="232.9" y="57.2" class="ink">on</text>

    <text x="68.9" y="65.2" class="mid">QUIET WHILE TYPING</text>
    <text x="196.9" y="65.2" class="ink">on</text>
    <text x="232.9" y="65.2" class="wisp">off</text>

    <text x="68.9" y="73.2" class="mid">CLICK</text>
    <text x="196.9" y="73.2" class="ink">by area</text>
    <text x="232.9" y="73.2" class="wisp">by fingers</text>

    <text x="68.9" y="81.2" class="mid">SCROLL</text>
    <text x="196.9" y="81.2" class="ink">two fingers</text>
    <text x="240.9" y="81.2" class="wisp">the edge</text>

    <!-- the row the keys are on: marked once, in the one accent on the sheet.
         SPEED is an ordered quantity, so it is a position along a scale. -->
    <line x1="64.9" y1="88" x2="67.9" y2="88" class="accent" stroke-width="0.7"/>
    <text x="68.9" y="89.2" class="ink">SPEED</text>
    <line x1="196.9" y1="88" x2="262.9" y2="88" class="rule" stroke-width="0.25"/>
    <line x1="196.9" y1="86.8" x2="196.9" y2="89.2" class="rule" stroke-width="0.25"/>
    <line x1="213.4" y1="86.8" x2="213.4" y2="89.2" class="rule" stroke-width="0.25"/>
    <line x1="229.9" y1="85.5" x2="229.9" y2="90.5" class="accent" stroke-width="0.7"/>
    <line x1="246.4" y1="86.8" x2="246.4" y2="89.2" class="rule" stroke-width="0.25"/>
    <line x1="262.9" y1="86.8" x2="262.9" y2="89.2" class="rule" stroke-width="0.25"/>
    <text x="266.9" y="89.2" class="ink">standard</text>

    <text x="68.9" y="97.2" class="mid">MIDDLE BUTTON</text>
    <text x="196.9" y="97.2" class="wisp">off</text>
    <text x="232.9" y="97.2" class="ink">on</text>

    <text x="68.9" y="105.2" class="mid">LEFT-HANDED</text>
    <text x="196.9" y="105.2" class="wisp">off</text>
    <text x="232.9" y="105.2" class="ink">on</text>
  </g>

  <!-- ===== the notes corner =====
       One field, in the place a drawing keeps its notes, reading whatever row you are on. The nine
       permanent captions are gone: at a glance the sheet says one thing, and the detail is here on
       the next look. Nothing moves; one field changes what it reads. -->
  <text x="12.9" y="140" class="wisp" font-size="2.5" letter-spacing="0.3">NOTE</text>
  <text x="12.9" y="148" class="mid" font-size="3.5">how far a finger carries the pointer:</text>
  <text x="12.9" y="155" class="mid" font-size="3.5">libinput's acceleration, −1 to 1.</text>
  <text x="12.9" y="165" class="wisp" font-size="2.5">[touchpad] speed = 0.0</text>

  <!-- ===== the sheet's own title block, showing through ===== -->
  <g>
    <line x1="165.1" y1="146.6" x2="295.1" y2="146.6" class="rule" stroke-width="0.5"/>
    <line x1="165.1" y1="146.6" x2="165.1" y2="182.6" class="rule" stroke-width="0.5"/>
    <line x1="165.1" y1="158.6" x2="295.1" y2="158.6" class="rule" stroke-width="0.25"/>
    <line x1="165.1" y1="170.6" x2="295.1" y2="170.6" class="rule" stroke-width="0.25"/>
    <line x1="208.4" y1="146.6" x2="208.4" y2="182.6" class="rule" stroke-width="0.25"/>
    <line x1="251.7" y1="146.6" x2="251.7" y2="182.6" class="rule" stroke-width="0.25"/>
    <g font-size="2.5" class="wisp">
      <text x="167.6" y="151">PROJECT</text>
      <text x="210.9" y="151">POWER</text>
      <text x="254.2" y="151">NETWORK</text>
      <text x="167.6" y="163">DRAWN</text>
      <text x="210.9" y="163">CPU / MEM</text>
      <text x="254.2" y="163">TEMP</text>
      <text x="167.6" y="175">SCALE</text>
      <text x="210.9" y="175">PROFILE</text>
      <text x="254.2" y="175">SHEET</text>
    </g>
    <g font-size="3.5" class="mid">
      <text x="167.6" y="156">SIGNAL</text>
      <text x="210.9" y="156">87%</text>
      <text x="254.2" y="156">capella</text>
      <text x="167.6" y="168">dann</text>
      <text x="210.9" y="168">4% · 23%</text>
      <text x="254.2" y="168">47°</text>
      <text x="167.6" y="180">1:1</text>
      <text x="210.9" y="180">perf</text>
      <text x="254.2" y="180">1 OF 1</text>
    </g>
  </g>
</svg>
