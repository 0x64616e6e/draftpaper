field_fg             = "#E6EEF5"
term_bg              = "#13253B"
term_fg              = "#E6EEF5"
term_bg_alt          = "#1A3049"
accent               = "#8FC1F0"
accent_dim           = "#5F95C8"
on_accent            = "#0F1E30"
secondary            = "#7FD1C7"
