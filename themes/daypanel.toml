field                = "#686f82"
field_fg             = "#F6F3EA"
term_bg              = "#2a6272"
term_fg              = "#F4F1E6"
term_bg_alt          = "#336d7e"
accent               = "#D97B12"
accent_dim           = "#B5650E"
